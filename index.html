<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reel – your highlight video</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
  --bg:#161a22; --panel:#1f242e; --panel-2:#272d39; --line:#343b49;
  --ink:#f3efe6; --ink-2:#aab1bf; --ink-3:#737b8a;
  --ring:#e2322b; --ring-soft:rgba(226,50,43,.18);
  --ok:#4fbf7a;
  --font-head:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --font:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f3efe6; --panel:#ffffff; --panel-2:#eae5d9; --line:#d9d3c4;
  --ink:#171a20; --ink-2:#4b5262; --ink-3:#7b8290; --ring-soft:rgba(226,50,43,.12);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --bg:#f3efe6; --panel:#ffffff; --panel-2:#eae5d9; --line:#d9d3c4;
    --ink:#171a20; --ink-2:#4b5262; --ink-3:#7b8290; --ring-soft:rgba(226,50,43,.12);
  }
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}

.app{max-width:720px;margin:0 auto;padding:0 0 48px}
header{padding:18px 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
header h1{font-family:var(--font-head);font-weight:700;font-size:34px;letter-spacing:.5px;margin:0;line-height:1}
header h1 span{display:inline-block;width:.42em;height:.42em;border:3px solid var(--ring);border-radius:50%;vertical-align:middle;margin-left:6px;transform:translateY(-3px)}
header small{color:var(--ink-3);font-size:13px;display:block}
header select{font:inherit;font-size:14px;background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:46vw}

.stage{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:0 0 10px}
.frame{position:relative;background:#000;aspect-ratio:16/9;overflow:hidden}
.frame video{width:100%;height:100%;display:block;object-fit:contain;background:#000}
.frame canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.frame .tap{position:absolute;inset:0;cursor:crosshair;display:none}
.frame.marking .tap{display:block}
.frame .hint{position:absolute;left:0;right:0;bottom:0;padding:8px 12px;font-size:14px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.75));pointer-events:none;display:none}
.frame.marking .hint{display:block}
.frame .crop{position:absolute;top:0;bottom:0;border-left:2px solid rgba(255,255,255,.7);border-right:2px solid rgba(255,255,255,.7);pointer-events:none;display:none}
.frame.vertical .crop{display:block}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--ink-2)}
.empty b{display:block;color:#fff;font-family:var(--font-head);font-size:28px;font-weight:700;margin-bottom:4px}
.empty p{margin:0;font-size:14px;max-width:34ch}
.transport{display:flex;align-items:center;gap:10px;padding:10px 16px 0}
.transport .time{font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:14px;min-width:96px}
.transport input[type=range]{flex:1;accent-color:var(--ring)}

section{padding:16px;border-top:1px solid var(--line)}
section h2{font-family:var(--font-head);font-size:22px;font-weight:700;margin:0 0 4px;display:flex;align-items:center;gap:10px}
section h2 i{font-style:normal;font-size:14px;font-family:var(--font);font-weight:600;color:var(--bg);background:var(--ink);border-radius:50%;width:22px;height:22px;display:inline-grid;place-items:center}
section h2 i.done{background:var(--ok);color:#fff}
section p.lead{margin:0 0 12px;color:var(--ink-2);font-size:15px}

button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 16px;background:var(--panel-2);color:var(--ink);cursor:pointer;min-height:44px}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--ring);color:#fff}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--ink-2)}
button.big{width:100%;font-size:18px;font-family:var(--font-head);letter-spacing:.3px;min-height:52px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row > *{flex:1}
label.file{display:block}
label.file input{display:none}

.clips{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.clip{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.clip.active{border-color:var(--ring);box-shadow:0 0 0 3px var(--ring-soft)}
.clip input[type=checkbox]{width:22px;height:22px;accent-color:var(--ring)}
.clip .t{flex:1;cursor:pointer;min-width:0}
.clip .t b{font-variant-numeric:tabular-nums}
.clip .t small{display:block;color:var(--ink-3);font-size:13px}
.clip .x{background:none;padding:6px 8px;color:var(--ink-3);min-height:0}
.clip .pts{font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:4px}
.clip .pts::before{content:"";width:10px;height:10px;border:2px solid var(--ring);border-radius:50%}
.recording{color:var(--ring);font-weight:600}

.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field label{color:var(--ink-2)}
.field .val{min-width:3.5ch;text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums}
.seg{display:flex;background:var(--panel-2);border-radius:10px;padding:3px}
.seg button{background:transparent;padding:8px 12px;min-height:38px;color:var(--ink-2);flex:1}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.swatches{display:flex;gap:8px}
.swatches button{width:34px;height:34px;min-height:0;padding:0;border-radius:50%;border:3px solid transparent;flex:none}
.swatches button[aria-pressed=true]{border-color:var(--ink)}
.music{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.music .name{flex:1;color:var(--ink-2);font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.progress{height:8px;background:var(--panel-2);border-radius:4px;overflow:hidden;margin:12px 0 6px;display:none}
.progress div{height:100%;background:var(--ring);width:0;transition:width .2s}
.status{color:var(--ink-2);font-size:14px;min-height:20px}
.result{margin-top:12px;display:none}
.result video{width:100%;border-radius:10px;background:#000}
.result .note{font-size:13px;color:var(--ink-3);margin-top:6px}
.summary{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px;display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.summary b{font-family:var(--font-head);font-size:22px;font-weight:700}
.summary small{display:block;color:var(--ink-3);font-size:13px}

/* access gate */
.gate{position:fixed;inset:0;background:var(--bg);z-index:20;display:grid;place-items:center;padding:24px}
.gate.hidden{display:none}
.gate form{width:100%;max-width:360px}
.gate h1{font-family:var(--font-head);font-size:44px;margin:0 0 4px;line-height:1}
.gate h1 span{display:inline-block;width:.42em;height:.42em;border:3px solid var(--ring);border-radius:50%;vertical-align:middle;margin-left:6px;transform:translateY(-4px)}
.gate p{color:var(--ink-2);margin:0 0 16px}
.gate input{width:100%;font:inherit;font-size:18px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);margin-bottom:10px;text-transform:uppercase;letter-spacing:.1em}
.gate .err{color:var(--ring);font-size:14px;min-height:20px;margin-top:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="gate" id="gate">
  <form id="gateForm">
    <h1>Reel<span aria-hidden="true"></span></h1>
    <p data-i18n="gate_body"></p>
    <input id="gateCode" autocomplete="off" autocapitalize="characters" placeholder="CODE" aria-label="Access code">
    <button class="big primary" type="submit" data-i18n="gate_btn"></button>
    <div class="err" id="gateErr"></div>
  </form>
</div>

<div class="app">
<header>
  <div><h1>Reel<span aria-hidden="true"></span></h1><small data-i18n="tagline"></small></div>
  <select id="lang" aria-label="Language"></select>
</header>

<div class="stage">
  <div class="frame" id="frame">
    <video id="video" playsinline preload="metadata" crossorigin="anonymous"></video>
    <canvas id="overlay"></canvas>
    <div class="crop" id="cropGuide"></div>
    <div class="tap" id="tap" role="button"></div>
    <div class="hint" data-i18n="hint"></div>
    <div class="empty" id="empty"><div><b data-i18n="empty_title"></b><p data-i18n="empty_body"></p></div></div>
  </div>
  <div class="transport">
    <button id="playBtn" disabled aria-label="Play / pause">▶</button>
    <input type="range" id="scrub" min="0" max="0" step="0.05" value="0" disabled aria-label="Scrub">
    <span class="time" id="time">0:00 / 0:00</span>
  </div>
</div>

<section>
  <h2><i id="s1">1</i><span data-i18n="s1"></span></h2>
  <p class="lead" data-i18n="s1_lead"></p>
  <label class="file"><input type="file" id="videoFile" accept="video/*"><button class="big" type="button" onclick="document.getElementById('videoFile').click()" data-i18n="pick_video"></button></label>
</section>

<section>
  <h2><i id="s2">2</i><span data-i18n="s2"></span></h2>
  <p class="lead" data-i18n="s2_lead"></p>
  <div class="row">
    <button id="inBtn" class="primary" disabled data-i18n="start"></button>
    <button id="outBtn" disabled data-i18n="stop"></button>
  </div>
  <div class="status" id="clipStatus"></div>
  <ul class="clips" id="clips"></ul>
</section>

<section>
  <h2><i id="s3">3</i><span data-i18n="s3"></span></h2>
  <p class="lead" data-i18n="s3_lead"></p>
  <div class="row">
    <button id="markBtn" disabled data-i18n="mark"></button>
    <button id="clearPtsBtn" class="ghost" disabled data-i18n="clear_pts"></button>
  </div>
  <div class="status" id="markStatus"></div>
</section>

<section>
  <h2><i>4</i><span data-i18n="s4"></span></h2>
  <div class="field"><label data-i18n="ring"></label>
    <div class="swatches" id="swatches">
      <button data-c="#e2322b" style="background:#e2322b" aria-pressed="true" data-i18n-aria="c_red"></button>
      <button data-c="#ffd400" style="background:#ffd400" data-i18n-aria="c_yellow"></button>
      <button data-c="#ffffff" style="background:#fff" data-i18n-aria="c_white"></button>
      <button data-c="#1ec8ff" style="background:#1ec8ff" data-i18n-aria="c_blue"></button>
    </div>
  </div>
  <div class="field"><label for="ringSize" data-i18n="ring_size"></label><input type="range" id="ringSize" min="20" max="90" value="46"><span class="val" id="ringSizeVal">46</span></div>
  <div class="field"><label data-i18n="speed"></label>
    <div class="seg" id="speedSeg">
      <button data-s="0.5">0.5×</button><button data-s="0.75">0.75×</button><button data-s="1" aria-pressed="true">1×</button><button data-s="1.5">1.5×</button>
    </div>
  </div>
  <div class="field"><label data-i18n="format"></label>
    <div class="seg" id="formatSeg">
      <button data-f="16:9" aria-pressed="true">16:9</button><button data-f="9:16" data-i18n="follow"></button>
    </div>
  </div>
  <div class="field"><label data-i18n="music"></label>
    <div class="music">
      <label class="file"><input type="file" id="musicFile" accept="audio/*"><button type="button" onclick="document.getElementById('musicFile').click()" data-i18n="pick_music"></button></label>
      <span class="name" id="musicName"></span>
    </div>
  </div>
  <div class="field"><label for="musicVol" data-i18n="music_vol"></label><input type="range" id="musicVol" min="0" max="100" value="80"><span class="val" id="musicVolVal">80</span></div>
  <div class="field"><label for="gameVol" data-i18n="game_vol"></label><input type="range" id="gameVol" min="0" max="100" value="25"><span class="val" id="gameVolVal">25</span></div>
</section>

<section>
  <h2><i>5</i><span data-i18n="s5"></span></h2>
  <div class="summary"><div><b id="sumClips">0</b><small data-i18n="sum_clips"></small></div><div><b id="sumLen">0:00</b><small data-i18n="sum_len"></small></div><div><b id="sumPts">0</b><small data-i18n="sum_pts"></small></div></div>
  <p class="lead" data-i18n="s5_lead"></p>
  <button id="exportBtn" class="big primary" disabled data-i18n="export"></button>
  <div class="progress" id="progress"><div id="progressBar"></div></div>
  <div class="status" id="exportStatus"></div>
  <div class="result" id="result">
    <video id="resultVideo" controls playsinline></video>
    <div class="row" style="margin-top:8px"><button id="saveBtn" class="primary" data-i18n="save"></button></div>
    <div class="note" id="resultNote"></div>
  </div>
</section>
</div>

let lang = 'en';
const t = (k, v={}) => (L[lang][k] ?? L.en[k] ?? k).replace(/\{(\w+)\}/g, (_,x) => v[x] ?? '');
function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', t(el.dataset.i18nAria)));
  $('tap').setAttribute('aria-label', t('hint'));
  if (!state.musicFile) $('musicName').textContent = t('no_music');
  $('markBtn').textContent = state.marking ? t('done') : t('mark');
  if (state.clips) renderClips();
}
const sel = $('lang');
Object.keys(L).forEach(k => { const o = document.createElement('option'); o.value = k; o.textContent = L[k]._n; sel.appendChild(o); });
try { lang = localStorage.getItem('reel-lang') || (navigator.language||'en').slice(0,2); } catch(e){}
if (!L[lang]) lang = 'en';
sel.value = lang;
sel.onchange = () => { lang = sel.value; try{ localStorage.setItem('reel-lang', lang); }catch(e){} applyLang(); };

// ---------- access gate ----------
const CODES = ['REEL2026'];
let unlocked = false;
try { unlocked = localStorage.getItem('reel-access') === '1'; } catch(e){}
if (unlocked) $('gate').classList.add('hidden');
$('gateForm').onsubmit = e => {
  e.preventDefault();
  const c = $('gateCode').value.trim().toUpperCase();
  if (CODES.includes(c)){ $('gate').classList.add('hidden'); try{ localStorage.setItem('reel-access','1'); }catch(e){} }
  else $('gateErr').textContent = t('gate_bad');
};

const video = $('video'), overlay = $('overlay'), frame = $('frame');
const ctx = overlay.getContext('2d');

const state = {
  clips: [], activeId: null, pendingIn: null, marking: false,
  ringColor: '#e2322b', ringSize: 46, speed: 1, format: '16:9',
  musicFile: null, musicVol: .8, gameVol: .25,
  resultBlob: null, resultExt: 'webm', exporting: false
};

const fmt = s => { s = Math.max(0, s||0); const m = Math.floor(s/60), r = Math.floor(s%60); return m + ':' + String(r).padStart(2,'0'); };
const uid = () => Math.random().toString(36).slice(2,8);
const active = () => state.clips.find(c => c.id === state.activeId);
const clipAt = tt => state.clips.find(c => tt >= c.in && tt <= c.out);
const sortedClips = () => [...state.clips].sort((a,b)=>a.in-b.in);
const selected = () => sortedClips().filter(c => c.on && c.out > c.in);

function ringAt(clip, tt){
  if (!clip || !clip.pts.length) return null;
  const pts = [...clip.pts].sort((a,b)=>a.t-b.t);
  if (tt <= pts[0].t) return pts[0];
  if (tt >= pts[pts.length-1].t) return pts[pts.length-1];
  for (let i=0;i<pts.length-1;i++){
    const a = pts[i], b = pts[i+1];
    if (tt >= a.t && tt <= b.t){ const k = (tt-a.t)/((b.t-a.t)||1); return {x:a.x+(b.x-a.x)*k, y:a.y+(b.y-a.y)*k}; }
  }
  return pts[pts.length-1];
}
function contentRect(boxW, boxH){
  const vw = video.videoWidth||16, vh = video.videoHeight||9;
  const s = Math.min(boxW/vw, boxH/vh);
  const w = vw*s, h = vh*s;
  return {x:(boxW-w)/2, y:(boxH-h)/2, w, h};
}
function drawRing(c, cx, cy, r, lw){
  c.save(); c.lineWidth = lw; c.strokeStyle = state.ringColor;
  c.shadowColor = 'rgba(0,0,0,.6)'; c.shadowBlur = lw*1.5;
  c.beginPath(); c.ellipse(cx, cy, r, r*.55, 0, 0, Math.PI*2); c.stroke(); c.restore();
}

function sizeOverlay(){
  const r = frame.getBoundingClientRect();
  overlay.width = Math.round(r.width*devicePixelRatio); overlay.height = Math.round(r.height*devicePixelRatio);
}
function renderOverlay(){
  const r = frame.getBoundingClientRect();
  if (overlay.width !== Math.round(r.width*devicePixelRatio)) sizeOverlay();
  const W = overlay.width, H = overlay.height;
  ctx.clearRect(0,0,W,H);
  if (!video.videoWidth) return;
  const cr = contentRect(W,H);
  const tt = video.currentTime;
  const clip = active() && tt>=active().in && tt<=active().out ? active() : clipAt(tt);
  const p = ringAt(clip, tt);
  if (p){ drawRing(ctx, cr.x + p.x*cr.w, cr.y + p.y*cr.h, cr.h*(state.ringSize/1000)*1.6, Math.max(2, cr.h*0.008)); }
  const a = active();
  if (a && state.marking){
    a.pts.forEach(k => { ctx.fillStyle = Math.abs(k.t-tt)<0.08 ? state.ringColor : 'rgba(255,255,255,.7)'; ctx.beginPath(); ctx.arc(cr.x+k.x*cr.w, cr.y+k.y*cr.h, 4*devicePixelRatio, 0, Math.PI*2); ctx.fill(); });
  }
  const g = $('cropGuide');
  if (state.format === '9:16'){
    const cw = cr.h * 9/16;
    let cx = p ? cr.x + p.x*cr.w : cr.x + cr.w/2;
    cx = Math.min(Math.max(cx, cr.x+cw/2), cr.x+cr.w-cw/2);
    g.style.left = (cx-cw/2)/devicePixelRatio + 'px'; g.style.width = cw/devicePixelRatio + 'px';
  }
}
function loop(){ if (!state.exporting) renderOverlay(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
addEventListener('resize', sizeOverlay);

const scrub = $('scrub');
let scrubbing = false;
$('playBtn').onclick = () => video.paused ? video.play() : video.pause();
video.addEventListener('play', ()=> $('playBtn').textContent = '❚❚');
video.addEventListener('pause', ()=> $('playBtn').textContent = '▶');
video.addEventListener('timeupdate', () => { if (!scrubbing) scrub.value = video.currentTime; $('time').textContent = fmt(video.currentTime)+' / '+fmt(video.duration); });
scrub.addEventListener('input', () => { scrubbing = true; video.currentTime = +scrub.value; $('time').textContent = fmt(video.currentTime)+' / '+fmt(video.duration); });
scrub.addEventListener('change', () => { scrubbing = false; });

$('videoFile').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  if (video.src) URL.revokeObjectURL(video.src);
  video.src = URL.createObjectURL(f); video.load();
  $('empty').style.display = 'none';
  state.clips = []; state.activeId = null; state.pendingIn = null;
  video.addEventListener('loadedmetadata', () => {
    scrub.max = video.duration; scrub.disabled = false; $('playBtn').disabled = false;
    $('inBtn').disabled = false; $('s1').classList.add('done'); $('s1').textContent = '✓';
    $('time').textContent = '0:00 / '+fmt(video.duration);
    sizeOverlay(); renderClips();
  }, {once:true});
};

$('inBtn').onclick = () => {
  state.pendingIn = video.currentTime;
  $('inBtn').disabled = true; $('outBtn').disabled = false;
  $('clipStatus').innerHTML = '<span class="recording">● </span>' + t('clip_started',{t:fmt(state.pendingIn)});
};
$('outBtn').onclick = () => {
  const out = video.currentTime;
  if (out - state.pendingIn < 0.5){ $('clipStatus').textContent = t('clip_short'); return; }
  const c = {id:uid(), in:state.pendingIn, out, on:true, pts:[]};
  state.clips.push(c); state.activeId = c.id; state.pendingIn = null;
  $('inBtn').disabled = false; $('outBtn').disabled = true;
  $('clipStatus').textContent = t('clip_saved');
  renderClips();
};

function renderClips(){
  const ul = $('clips'); ul.innerHTML = '';
  sortedClips().forEach((c, i) => {
    const li = document.createElement('li'); li.className = 'clip' + (c.id===state.activeId?' active':'');
    const cb = document.createElement('input'); cb.type='checkbox'; cb.checked = c.on; cb.setAttribute('aria-label', t('include_clip',{n:i+1}));
    cb.onchange = () => { c.on = cb.checked; updateSummary(); };
    const tt = document.createElement('div'); tt.className='t';
    tt.innerHTML = '<b>'+fmt(c.in)+' – '+fmt(c.out)+'</b><small>'+ (c.out-c.in).toFixed(1) +' s</small>';
    tt.onclick = () => { state.activeId = c.id; video.pause(); video.currentTime = c.in; renderClips(); };
    const pts = document.createElement('span'); pts.className='pts'; pts.textContent = c.pts.length;
    const x = document.createElement('button'); x.className='x'; x.textContent='✕'; x.setAttribute('aria-label', t('remove_clip'));
    x.onclick = () => { state.clips = state.clips.filter(k=>k!==c); if (state.activeId===c.id) state.activeId = null; stopMarking(); renderClips(); };
    li.append(cb, tt, pts, x); ul.appendChild(li);
  });
  const has = state.clips.length>0;
  $('s2').classList.toggle('done', has); $('s2').textContent = has ? '✓' : '2';
  $('markBtn').disabled = !active(); $('clearPtsBtn').disabled = !(active() && active().pts.length);
  if (!active()) $('markStatus').textContent = has ? t('choose_clip') : '';
  else if (!state.marking) $('markStatus').textContent = t('selected_clip',{a:fmt(active().in), b:fmt(active().out), n:active().pts.length});
  updateSummary();
}

function startMarking(){
  const c = active(); if (!c) return;
  state.marking = true; frame.classList.add('marking'); video.pause();
  if (video.currentTime < c.in || video.currentTime > c.out) video.currentTime = c.in;
  $('markBtn').textContent = t('done');
  $('markStatus').textContent = t('marking_help');
}
function stopMarking(){
  state.marking = false; frame.classList.remove('marking'); $('markBtn').textContent = t('mark');
  renderClips();
}
$('markBtn').onclick = () => state.marking ? stopMarking() : startMarking();
$('clearPtsBtn').onclick = () => { const c = active(); if (c){ c.pts = []; renderClips(); } };
$('tap').addEventListener('click', e => {
  const c = active(); if (!c) return;
  const r = frame.getBoundingClientRect();
  const cr = contentRect(r.width, r.height);
  const x = (e.clientX - r.left - cr.x)/cr.w, y = (e.clientY - r.top - cr.y)/cr.h;
  if (x<0||x>1||y<0||y>1) return;
  const tt = Math.min(Math.max(video.currentTime, c.in), c.out);
  c.pts = c.pts.filter(p => Math.abs(p.t-tt) > 0.15);
  c.pts.push({t:tt, x, y});
  const n = c.pts.length;
  $('markStatus').textContent = n===1 ? t('pt1') : t('ptn',{n});
  $('clearPtsBtn').disabled = false;
  const li = document.querySelector('.clip.active .pts'); if (li) li.textContent = n;
  $('s3').classList.add('done'); $('s3').textContent = '✓';
  updateSummary();
});

$('swatches').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; state.ringColor = b.dataset.c; [...$('swatches').children].forEach(x=>x.setAttribute('aria-pressed', x===b)); });
$('ringSize').oninput = e => { state.ringSize = +e.target.value; $('ringSizeVal').textContent = e.target.value; };
$('speedSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; state.speed = +b.dataset.s; [...$('speedSeg').children].forEach(x=>x.setAttribute('aria-pressed', x===b)); updateSummary(); });
$('formatSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; state.format = b.dataset.f; frame.classList.toggle('vertical', state.format==='9:16'); [...$('formatSeg').children].forEach(x=>x.setAttribute('aria-pressed', x===b)); });
$('musicFile').onchange = e => { state.musicFile = e.target.files[0]||null; $('musicName').textContent = state.musicFile ? state.musicFile.name : t('no_music'); };
$('musicVol').oninput = e => { state.musicVol = e.target.value/100; $('musicVolVal').textContent = e.target.value; };
$('gameVol').oninput = e => { state.gameVol = e.target.value/100; $('gameVolVal').textContent = e.target.value; };

function updateSummary(){
  const s = selected();
  const len = s.reduce((a,c)=>a+(c.out-c.in),0)/state.speed;
  $('sumClips').textContent = s.length; $('sumLen').textContent = fmt(len);
  $('sumPts').textContent = s.filter(c=>!c.pts.length).length;
  $('exportBtn').disabled = !s.length || state.exporting;
}

let audioCtx, gameSrc, gameGain, musicEl, musicSrc, musicGain, dest;
function ensureAudio(){
  if (audioCtx) return;
  audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  dest = audioCtx.createMediaStreamDestination();
  gameSrc = audioCtx.createMediaElementSource(video);
  gameGain = audioCtx.createGain();
  gameSrc.connect(gameGain); gameGain.connect(audioCtx.destination); gameGain.connect(dest);
}
const sleep = ms => new Promise(r=>setTimeout(r,ms));
function seekTo(tt){ return new Promise(res => { const h = () => { video.removeEventListener('seeked', h); res(); }; video.addEventListener('seeked', h); video.currentTime = tt; }); }

async function exportReel(){
  const clips = selected(); if (!clips.length) return;
  state.exporting = true; stopMarking(); updateSummary();
  $('result').style.display='none'; $('progress').style.display='block'; $('progressBar').style.width='0%';
  const status = s => $('exportStatus').textContent = s;
  try {
    ensureAudio(); await audioCtx.resume();
    gameGain.gain.value = state.gameVol;
    if (musicEl){ musicEl.pause(); try{ musicSrc.disconnect(); }catch(e){} musicEl = null; }
    if (state.musicFile){
      musicEl = new Audio(URL.createObjectURL(state.musicFile)); musicEl.loop = true; musicEl.crossOrigin='anonymous';
      musicSrc = audioCtx.createMediaElementSource(musicEl); musicGain = audioCtx.createGain(); musicGain.gain.value = state.musicVol;
      musicSrc.connect(musicGain); musicGain.connect(dest);
    }
    const vw = video.videoWidth, vh = video.videoHeight;
    const out = document.createElement('canvas');
    if (state.format==='9:16'){ out.height = Math.min(vh, 1280); out.width = Math.round(out.height*9/16); }
    else { out.width = Math.min(vw, 1280); out.height = Math.round(out.width*vh/vw); }
    const oc = out.getContext('2d');
    const stream = out.captureStream(30);
    dest.stream.getAudioTracks().forEach(tr => stream.addTrack(tr));
    const types = ['video/mp4;codecs=avc1,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
    const mime = types.find(x => MediaRecorder.isTypeSupported(x)) || '';
    state.resultExt = mime.startsWith('video/mp4') ? 'mp4' : 'webm';
    const rec = new MediaRecorder(stream, mime ? {mimeType:mime, videoBitsPerSecond:6_000_000} : undefined);
    const chunks = []; rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    const done = new Promise(r => rec.onstop = r);

    const total = clips.reduce((a,c)=>a+(c.out-c.in),0);
    let played = 0, cur = null, smoothX = null;
    video.pause(); video.muted = false; video.playbackRate = state.speed;

    const draw = () => {
      if (!cur) return;
      const tt = video.currentTime;
      const p = ringAt(cur, tt);
      if (state.format==='9:16'){
        const srcH = vh, srcW = srcH*9/16;
        const cx = p ? p.x*vw : vw/2;
        smoothX = smoothX==null ? cx : smoothX + (cx-smoothX)*0.08;
        const sx = Math.min(Math.max(smoothX - srcW/2, 0), vw-srcW);
        oc.drawImage(video, sx, 0, srcW, srcH, 0, 0, out.width, out.height);
        if (p) drawRing(oc, (p.x*vw - sx)/srcW*out.width, p.y*out.height, out.height*(state.ringSize/1000)*1.6, Math.max(3, out.height*0.008));
      } else {
        oc.drawImage(video, 0, 0, out.width, out.height);
        if (p) drawRing(oc, p.x*out.width, p.y*out.height, out.height*(state.ringSize/1000)*1.6, Math.max(3, out.height*0.008));
      }
      $('progressBar').style.width = Math.min(100, (played + Math.max(0, tt-cur.in))/total*100).toFixed(1)+'%';
    };
    let raf; const tick = () => { draw(); raf = requestAnimationFrame(tick); };

    rec.start(250);
    if (musicEl){ musicEl.currentTime = 0; await musicEl.play().catch(()=>{}); }
    raf = requestAnimationFrame(tick);

    for (let i=0;i<clips.length;i++){
      cur = clips[i]; smoothX = null;
      status(t('rec_clip',{i:i+1, n:clips.length}));
      await seekTo(cur.in);
      await video.play();
      await new Promise(res => { const h = () => { if (video.currentTime >= cur.out || video.ended){ video.removeEventListener('timeupdate', h); res(); } }; video.addEventListener('timeupdate', h); });
      video.pause();
      played += cur.out-cur.in;
    }
    await sleep(300);
    cancelAnimationFrame(raf);
    rec.stop(); await done;
    if (musicEl) musicEl.pause();
    video.playbackRate = 1;

    state.resultBlob = new Blob(chunks, {type: mime || 'video/webm'});
    const rv = $('resultVideo'); if (rv.src) URL.revokeObjectURL(rv.src);
    rv.src = URL.createObjectURL(state.resultBlob);
    $('result').style.display='block'; $('progressBar').style.width='100%';
    status(t('done_msg',{t:fmt(total/state.speed), mb:(state.resultBlob.size/1e6).toFixed(1)}));
    $('resultNote').textContent = state.resultExt==='webm' ? t('note_webm') : t('note_mp4');
    $('result').scrollIntoView({behavior:'smooth', block:'center'});
  } catch (err){
    console.error(err);
    status(t('export_fail',{e: err && err.message ? err.message : String(err)}));
  } finally {
    state.exporting = false; updateSummary();
  }
}
$('exportBtn').onclick = exportReel;

let downloads = null;
if (window.claude && typeof claude.use === 'function') claude.use('downloads').then(d => { downloads = d; }).catch(()=>{});
$('saveBtn').onclick = async () => {
  if (!state.resultBlob) return;
  const filename = 'highlights-'+new Date().toISOString().slice(0,10)+'.'+state.resultExt;
  if (downloads){
    try { await downloads.save({filename, data: state.resultBlob}); $('resultNote').textContent = t('saved'); }
    catch (e){ if (e && e.code==='declined') return; $('resultNote').textContent = t('save_fail',{c:(e&&e.code)||'error'}); }
  } else {
    try {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(state.resultBlob); a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      $('resultNote').textContent = t('saved');
    } catch(e){ $('resultNote').textContent = t('save_manual'); }
  }
};

try {
  const s = JSON.parse(localStorage.getItem('reel-style')||'{}');
  if (s.ringColor){ state.ringColor = s.ringColor; [...$('swatches').children].forEach(x=>x.setAttribute('aria-pressed', x.dataset.c===s.ringColor)); }
  if (s.ringSize){ state.ringSize = s.ringSize; $('ringSize').value = s.ringSize; $('ringSizeVal').textContent = s.ringSize; }
} catch(e){}
addEventListener('pagehide', () => { try { localStorage.setItem('reel-style', JSON.stringify({ringColor:state.ringColor, ringSize:state.ringSize})); } catch(e){} });

applyLang();
})();
</script>
</body>
</html>
